<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="업무부 계약팀 소개">
  <title>업무부 계약팀 소개</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18324b;
      --muted: #526477;
      --accent: #176b73;
      --paper: #fff;
      --ground: #eef4f3;
      --line: #d9e5e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background: var(--ground);
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: clamp(22px, 4vw, 44px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(24, 50, 75, .08);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .86rem;
      font-weight: 700;
      letter-spacing: .08em;
    }
    h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.2; }
    .intro { margin: 12px 0 8px; color: var(--muted); }
    @media (max-width: 640px) {
      body { padding: 12px; }
      main { padding: 20px 14px; border-radius: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">우리 부서 소개</p>
    <h1>업무부 계약팀</h1>
    <p class="intro">발주처 계약, 청구 및 수금 업무와 내부 부서 관리를 맡습니다.</p>
  </main>
</body>
</html>
