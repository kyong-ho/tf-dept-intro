department: 업무부 계약팀

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="업무부 계약팀 소개">
  <title>업무부 계약팀 소개</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18324b;
      --muted: #526477;
      --accent: #176b73;
      --paper: #fff;
      --ground: #eaf4ff;
      --line: #d9e5e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background: var(--ground);
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: clamp(22px, 4vw, 44px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(24, 50, 75, .08);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .86rem;
      font-weight: 700;
      letter-spacing: .08em;
    }
    h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.2; }
    .intro { margin: 12px 0 8px; color: var(--muted); }
    .weekly {
      margin-top: 28px;
      padding: clamp(14px, 3vw, 28px);
      background: var(--ground);
      border: 1px solid #cbdff2;
      border-radius: 16px;
    }
    .weekly h2 { margin: 0 0 16px; font-size: 1.25rem; }
    .weekly table { width: 100%; border-collapse: collapse; background: var(--paper); }
    .weekly th, .weekly td {
      padding: 12px;
      border: 1px solid #cbdff2;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .weekly th { background: #dcecff; }
    .weekly th:last-child, .weekly td:last-child { width: 30%; white-space: nowrap; }
    @media (max-width: 640px) {
      body { padding: 12px; }
      main { padding: 20px 14px; border-radius: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">우리 부서 소개</p>
    <h1>업무부 계약팀</h1>
    <p class="intro">발주처와의 계약, 청구(선금, 기성, 준공) 및 수금 업무와 경호 내부 부서 관리를 맡습니다.</p>
    <section class="weekly" aria-labelledby="weekly-title">
      <h2 id="weekly-title">매주 반복하는 업무</h2>
      <table aria-labelledby="weekly-title">
        <thead>
          <tr><th scope="col">업무</th><th scope="col">반복 주기</th></tr>
        </thead>
        <tbody>
          <tr><td>발주처와의 계약</td><td>매주</td></tr>
          <tr><td>청구(선금, 기성, 준공)</td><td>매주</td></tr>
          <tr><td>수금 업무</td><td>매주</td></tr>
          <tr><td>경호 내부 부서 관리</td><td>매주</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
