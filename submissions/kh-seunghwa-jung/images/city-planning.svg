<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">용도지역 현황도 — 도시계획 전문가용 · 소개용 예시</title>
  <desc id="desc">가상의 구역에 제2종일반주거지역, 준주거지역, 일반상업지역, 준공업지역, 자연녹지지역을 표시한 예시 지도. 북쪽 방위표, 용도지역 경계와 도로, 하천을 표현했다. 실제 지역이나 법적 효력이 있는 도면이 아니다.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#607581" stroke-opacity=".12"/></pattern>
    <pattern id="lots" width="58" height="44" patternUnits="userSpaceOnUse"><path d="M58 0H0V44M29 0V44" fill="none" stroke="#596168" stroke-opacity=".28" stroke-width=".8"/></pattern>
    <clipPath id="map"><rect x="32" y="128" width="660" height="424" rx="3"/></clipPath>
  </defs>
  <rect width="960" height="640" rx="16" fill="#f8faf9"/>
  <g font-family="Malgun Gothic, sans-serif" fill="#243d35">
