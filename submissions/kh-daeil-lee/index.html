    .infographic-caption {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .topic-grid li {
      display: flex;
      align-items: center;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
    }

    .topic-grid li:last-child { grid-column: 1 / -1; }
    .duties {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .duties li {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: start;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      line-height: 1.7;
    }

    .number {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding-top: 3px;
    }

    .weekly {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border-radius: 16px;
      background: #f2f7f5;
    }

    .weekly p { margin: 0; font-size: 16px; font-weight: 700; }

    .tag {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      background: #dcece8;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 48px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 560px) {

      main { border-radius: 18px; }
      header { padding: 32px 24px; }
      .content { padding: 28px 24px 32px; }
