  <style>

    h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(40px, 7vw, 68px); line-height: 1.25; letter-spacing: -.06em; }
    .railway-image { display: block; width: 100%; height: auto; margin-top: 28px; border-radius: 24px; }
    section { margin-top: 54px; }
    h2 { margin: 0 0 22px; font-size: 24px; letter-spacing: -.04em; }
    ol { list-style: none; padding: 0; margin: 0; border-top: 2px solid #18332f; }
    li { display: flex; align-items: center; gap: 28px; padding: 30px 8px; border-bottom: 1px solid #cdd6ce; }
    .number { color: #517668; font-size: 14px; font-weight: 700; }
    .task { font-size: clamp(18px, 3vw, 23px); font-weight: 600; line-height: 1.65; word-break: keep-all; }
    @media (max-width: 600px) { main { padding: 32px 20px; } header { padding: 44px 28px; border-radius: 18px; } header::after { right: 0; } section { margin-top: 36px; } li { gap: 18px; padding: 24px 4px; } }
