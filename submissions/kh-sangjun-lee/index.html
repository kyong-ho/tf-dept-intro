<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무부 입찰팀 소개</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f8; color: #203248; font-family: "맑은 고딕", sans-serif; line-height: 1.8; }
    main { max-width: 760px; margin: 70px auto; padding: 48px; background: white; border-top: 6px solid #236b70; border-radius: 12px; box-shadow: 0 12px 40px #2032480d; }
    .label { margin: 0; color: #236b70; font-weight: bold; letter-spacing: .12em; font-size: 14px; }
    h1 { margin: 10px 0 36px; font-size: clamp(28px, 6vw, 40px); line-height: 1.4; }
    .work-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    section { min-width: 0; }
    h2 { margin: 0 0 10px; font-size: 19px; }
    p { margin: 0; }
    .daily { background: #e6f4ff; padding: 22px 24px; border-radius: 8px; }
    .weekly { background: #edf6f4; padding: 22px 24px; border-radius: 8px; }
    footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #e2e8ee; color: #596b7c; font-size: 14px; }
    @media (max-width: 600px) { main { margin: 24px 16px; padding: 28px 22px; } .work-columns { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p class="label">부서 소개</p>
    <h1>업무부 입찰팀</h1>
    <div class="work-columns">
    <section class="daily" aria-labelledby="work-title">
      <h2 id="work-title">하는 일</h2>
      <p>입찰공고 확인<br>발주처 자료 분석<br>금액 산출</p>
    </section>
    <section class="weekly" aria-labelledby="weekly-title">
      <h2 id="weekly-title">매주 반복하는 업무</h2>
      <p>차주 입찰 마감하는 공고 게시</p>
    </section>
    </div>
    <footer>만든 날짜 · <time datetime="2026-10-22">2026년 10월 22일</time></footer>
  </main>
</body>
</html>
