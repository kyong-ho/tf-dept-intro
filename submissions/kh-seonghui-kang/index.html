  <style>
    :root {
      color-scheme: light;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      color: #173d2c;
      background: #eef7e9;
      line-height: 1.6;
      word-break: keep-all;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    .page {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 40px clamp(24px, 6vw, 72px) 28px;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 24px;
      border-bottom: 1px solid #c2d9b6;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .mark {
      display: grid;
      grid-template-columns: repeat(2, 10px);
      gap: 3px;
      transform: rotate(-8deg);
    }

    .mark span { height: 10px; background: #43824b; border-radius: 2px; }
    .mark span:last-child { background: #9bce7b; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 1fr);
      align-items: center;
      gap: 32px;
      padding: 44px 0 40px;
    }

    .hero-copy { min-width: 0; }

    .hero-art {
      width: 100%;
      margin: 0;
      overflow: hidden;
      border: 1px solid #b1cc9c;
      border-radius: 26px;
      background: linear-gradient(145deg, #d8edc8, #a9d58f);
    }

    .hero-art svg { display: block; width: 100%; height: auto; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: #416b3c;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: #5c8a48;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.065em;
      overflow-wrap: anywhere;
    }

    .cards {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
    }

    .card {
      min-width: 0;
      padding: 32px;
      border-radius: 22px;
    }

    .work-card {
      background: #fbfdf7;
      border: 1px solid #cbdcbe;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .work-card h2 { color: #41623a; }

    .ai-card { grid-column: 1 / -1; }

    .work-table {
      width: 100%;
      margin-top: 22px;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: left;
      font-size: clamp(17px, 2.2vw, 21px);
    }

    .work-table th, .work-table td {
      padding: 16px 14px;
      border: 1px solid #c2d9b6;
      vertical-align: middle;
    }

    .work-table thead th {
      background: #d8edc8;
      color: #365930;
      font-size: 13px;
      font-weight: 700;
    }

    .work-table thead th:first-child { width: 64px; text-align: center; }

    .work-table tbody th {
      background: #eef7e9;
      color: #4c6c40;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .work-table td { font-weight: 600; overflow-wrap: anywhere; }

    .weekly-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #9bce7b;
      color: #173d2c;
    }

    .weekly-card h2 { color: #2e5228; }

    .frequency {
      margin: 30px 0 12px;
      padding: 3px 12px;
      border: 1px solid #628952;
      border-radius: 30px;
      color: #2e5228;
      font-size: 12px;
    }

    .weekly-task {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 36px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.04em;
    }

    .weekly-card::after {
      content: "";
      position: absolute;
      right: -38px;
      bottom: -74px;
      width: 200px;
      height: 200px;
      border: 1px solid #6f9956;
      border-radius: 50%;
      box-shadow: 0 0 0 24px #8fc66e, 0 0 0 25px #6f9956;
      opacity: 0.6;
      pointer-events: none;
    }

    footer {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
      color: #4d6843;
      font-size: 13px;
    }

    time { color: #31542c; font-variant-numeric: tabular-nums; }

    @media (max-width: 680px) {
      .page { padding-top: 26px; }
      .hero { grid-template-columns: 1fr; gap: 28px; padding: 36px 0 32px; }
      .hero-art { max-width: 480px; justify-self: center; border-radius: 20px; }
      .cards { grid-template-columns: 1fr; gap: 16px; }
      .card { padding: 26px; border-radius: 18px; }
      .work-table { margin-top: 18px; }
      .work-table th, .work-table td { padding: 14px 10px; }
      .work-table thead th:first-child { width: 52px; }
      .weekly-card { min-height: 230px; }
      .frequency { margin-top: 24px; }
      footer { justify-content: flex-start; }
    }

    @media print {
      :root { background: #fff; }
      .page { width: 100%; padding: 20px; }
      .hero { padding: 36px 0; }
      .cards { grid-template-columns: 1.35fr 1fr; }
      .weekly-card { color: #173d2c; background: #eef7e9; border: 1px solid #c2d9b6; }
      .weekly-card h2, .frequency { color: #31542c; }
      .weekly-card::after { display: none; }
    }
  </style>
</head>
