<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="구조부의 설계 업무와 매주 반복하는 업무를 소개합니다.">
  <title>구조부 소개</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f5fa; color: #24364d; font-family: "맑은 고딕", "Malgun Gothic", sans-serif; line-height: 1.8; word-break: keep-all; }
    main { width: min(880px, calc(100% - 40px)); margin: 64px auto; }
    header { padding: 48px; background: #193f70; color: #fff; border-radius: 24px 24px 0 0; }
    .label { margin: 0 0 12px; font-size: 14px; letter-spacing: .12em; color: #c9dcf5; }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 56px); line-height: 1.3; }
    .content { padding: 12px 48px 36px; background: #fff; border: 1px solid #d9e2ef; border-top: 0; border-radius: 0 0 24px 24px; }
    section { padding: 28px 0; }
    section + section { border-top: 1px solid #e1e8f2; }
    h2 { margin: 0 0 16px; font-size: 21px; }
    p { margin: 0; }
    .description p + p { margin-top: 8px; }
    .task { padding: 24px; background: #edf4fc; border-left: 4px solid #3974b8; border-radius: 4px 12px 12px 4px; }
    .task strong { display: block; margin-bottom: 8px; font-size: 18px; }
    footer { margin-top: 24px; color: #566b85; font-size: 14px; text-align: right; }
    @media (max-width: 540px) {
      main { margin: 24px auto; }
      header { padding: 32px 24px; }
      .content { padding: 4px 24px 20px; }
      .task { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">부서 소개</p>
      <h1>구조부</h1>
    </header>
    <div class="content">
      <section aria-labelledby="work-title">
        <h2 id="work-title">하는 일</h2>
        <div class="description">
          <p>교량, 옹벽, 암거 등 토목구조물을 설계합니다.</p>
          <p>철근콘크리트나 강재 등으로 이루어진 구조물을 다룹니다.</p>
        </div>
      </section>
      <section aria-labelledby="weekly-title">
        <h2 id="weekly-title">매주 반복하는 업무</h2>
        <div class="task">
          <strong>총괄수량집계표 작성</strong>
          <p>토공수량산출서, 상부수량산출서, 하부수량산출서, 상부철근집계표, 하부철근집계표, 가시설수량산출서를 작성한 뒤, 각 수량산출서와 집계표의 수량을 모두 모아 총괄수량집계표를 작성합니다.</p>
        </div>
      </section>
    </div>
    <footer>만든 날짜 · <time datetime="2026-10-19">2026년 10월 19일</time></footer>
  </main>
</body>
</html>
