department: AI혁신본부

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI혁신본부 소개</title>
    <style>
      :root { --paper: #ffffff; --ice: #eef5fc; --ink: #19334f; --blue: #245db2; --muted: #52677e; --line: #cddded; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ice); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
      main { max-width: 1280px; margin: 0 auto; padding: 56px 64px 24px; }
      .hero { display: grid; grid-template-columns: 0.8fr 1.2fr; align-items: center; gap: 48px; padding: 48px 0 64px; }
      .intro { margin: 0 0 22px; color: var(--muted); font-size: 16px; }
      h1 { margin: 0; font-size: clamp(40px, 5.5vw, 72px); font-weight: 800; letter-spacing: -0.065em; line-height: 1.2; }
      .definition { margin: 24px 0 0; color: var(--muted); font-size: 16px; }
      .department-image { display: block; width: 100%; height: auto; border-radius: 48px 8px 48px 8px; }
      .content { background: var(--paper); border-radius: 24px; padding: 44px 48px; }
      .work-section { display: grid; grid-template-columns: 180px 1fr; gap: 36px; }
      h2 { margin: 0; font-size: 21px; letter-spacing: -0.035em; line-height: 1.5; }
      .work { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; list-style: none; margin: 0; padding: 0; }
      .work li + li { border-left: 1px solid var(--line); padding-left: 36px; }
      h3 { margin: 0 0 12px; color: var(--blue); font-size: 24px; letter-spacing: -0.04em; line-height: 1.4; }
      .work p { margin: 0; max-width: 30em; font-size: 17px; }
      .weekly-section { display: grid; grid-template-columns: 180px 1fr; align-items: center; gap: 36px; margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
      .weekly { margin: 0; padding: 22px 28px; background: var(--ice); border-radius: 12px; font-size: 18px; }
      footer { padding: 24px 0 8px; color: var(--muted); font-size: 13px; text-align: right; }
      @media (max-width: 960px) {
        main { padding: 24px 32px; }
        .hero { gap: 28px; padding: 32px 0 40px; }
        .content { padding: 32px; }
        .work-section, .weekly-section { grid-template-columns: 1fr; gap: 24px; }
      }
      @media (max-width: 600px) {
        main { padding: 20px; }
        .hero { grid-template-columns: 1fr; gap: 28px; padding: 24px 0 28px; }
        .intro { margin-bottom: 12px; }
        .definition { margin-top: 16px; }
        .department-image { border-radius: 28px 6px 28px 6px; }
        .content { padding: 28px 24px; border-radius: 20px; }
        .work { grid-template-columns: 1fr; gap: 28px; }
        .work li + li { border-left: 0; padding-left: 0; }
        .weekly-section { margin-top: 28px; padding-top: 28px; gap: 16px; }
        .weekly { padding: 20px; font-size: 17px; }
        footer { text-align: left; }
      }
      @media print {
        body { background: white; }
        main { padding: 0; }
        .hero { padding: 20px 0; }
        .content { padding: 24px 0; }
        section { break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <div>
          <p class="intro">우리 부서 소개</p>
          <h1>AI혁신본부</h1>
          <p class="definition">AI는 인공지능을 뜻합니다.</p>
        </div>
        <img class="department-image" src="images/ai-innovation.png" width="1672" height="941" alt="동료들이 인공지능 교육을 듣고 자료와 노트북으로 프로젝트를 함께 논의하는 모습을 표현한 삽화">
      </header>
      <div class="content">
        <section class="work-section" aria-labelledby="work-title">
          <h2 id="work-title">하는 일</h2>
          <ul class="work">
            <li><h3>사내 AI 교육</h3><p>사내 구성원을 대상으로 인공지능(AI) 교육을 진행합니다.</p></li>
            <li><h3>AI 프로젝트 관리·개발</h3><p>사내 AI 프로젝트의 관리를 맡고, 개발도 함께 수행합니다.</p></li>
          </ul>
        </section>
        <section class="weekly-section" aria-labelledby="weekly-title">
          <h2 id="weekly-title">내가 매주 반복하는 업무</h2>
          <p class="weekly">저는 매주 AI 교육에 사용할 자료를 만듭니다.</p>
        </section>
      </div>
      <footer>만든 날짜 · <time datetime="2026-10-19">2026년 10월 19일</time></footer>
    </main>
  </body>
</html>
